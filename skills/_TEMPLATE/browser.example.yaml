# 浏览器测试配置模板
# 复制到 <数据目录>/projects/<项目ID>/browser/browser.yaml。
# 值一律写 ${变量}，真实值只放项目 .env。
# base_url 是前端页面根地址，不是接口网关。

version: 1
project: <项目ID>

envs:
  dev:
    base_url: ${WEB_BASE_URL}
  test:
    base_url: ${TEST_WEB_BASE_URL}

defaults:
  env: dev
  # 单步等待上限（毫秒）。条件满足会立即继续，这里只决定"失败要等多久"，建议 15000；
  # 个别确实慢的步骤在步骤上单独写 timeout。
  timeout_ms: 15000
  # 默认用后台常驻的专用无头 Chrome：不弹窗、不用每次重新启动，跑完只断开。
  # 设为 false 则回到每次启动、跑完关闭，此时才用下面的 headless。
  # resident: true
  headless: false
  # 接口异常快速失败：步骤等待期间接口报错（HTTP>=400、业务码非成功、网络失败）就提前判失败。默认开启。
  # api_watch:
  #   ignore: [/api/heartbeat]
  #   success_codes: [0, 200]
  #   grace_ms: 1500

login:
  url: ${BASE_URL}/login
  username: ${WEB_USERNAME}
  password: ${WEB_PASSWORD}
  steps:
    - click: {role: button, name: 使用账号密码登录}
      optional: true
    - fill: {placeholder: 手机号}
      value: ${username}
    - fill: {placeholder: 密码}
      value: ${password}
    - click: {role: button, name: 登 录}
  success:
    url_path: /index
    localStorage:
      Admin-Token: ".+"
